[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekorn"
version = "0.1.0"
description = "Lossless, recallable tool-output packing for coding agents (CLI launcher)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "ekornhq" }]
keywords = ["agent", "llm", "tokens", "context", "claude-code", "codex", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/ekornhq/ekorn"
Repository = "https://github.com/ekornhq/ekorn"
Issues = "https://github.com/ekornhq/ekorn/issues"

[project.scripts]
ekorn = "ekorn:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ekorn"]
