name: publish-shims

# Publishes the CLI launcher packages. Run by hand from the Actions tab.
# Secrets / settings needed once:
#   npm    -> repository secret NPM_TOKEN (granular token, publish permission on package "ekorn")
#   PyPI   -> trusted publisher on pypi.org: owner ekornhq, repo ekorn,
#             workflow publish-shims.yml, environment pypi (no secret needed)
#   crates -> repository secret CARGO_REGISTRY_TOKEN (crates.io API token with publish-new / publish-update)

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Which registry to publish to
        required: true
        default: all
        type: choice
        options: [all, npm, pypi, crates]

permissions:
  contents: read

jobs:
  npm:
    if: ${{ inputs.registry == 'all' || inputs.registry == 'npm' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node bin/ekorn.js --version
      - run: node bin/ekorn.js hook pre-tool-use < /dev/null
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: ${{ inputs.registry == 'all' || inputs.registry == 'pypi' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl && ekorn --version
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypi/dist

  crates:
    if: ${{ inputs.registry == 'all' || inputs.registry == 'crates' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked || cargo build --release
      - run: ./target/release/ekorn --version
      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
